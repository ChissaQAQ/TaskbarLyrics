name: 功能建议
description: 想要的新功能或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: 想要什么
      description: 尽量描述具体的使用场景，而不只是功能名 —— 场景清楚了往往能找到更省事的做法。
    validations:
      required: true

  - type: textarea
    id: now
    attributes:
      label: 现在是怎么将就的
      description: 目前用什么方式凑合（或者干脆做不到）。这决定了这件事到底有多值得做。

  - type: checkboxes
    id: scope
    attributes:
      label: 相关范围
      options:
        - label: 歌词内容（匹配、译文、罗马音、逐字）
        - label: 显示与动画
        - label: 交互（悬停、拖动、托盘菜单、设置）
        - label: 任务栏适配（多屏、避让、DPI、Win10）
